<!-- @dsCard group="Customer Portal" viewport="1280x800" name="Customer portal" subtitle="Track, shipments dashboard, quote & book" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><title>Orbit — Customer portal</title><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script></head><body><div id="root"></div>
<script type="text/babel" src="Header.jsx"></script><script type="text/babel" src="TrackScreen.jsx"></script><script type="text/babel" src="ShipmentsScreen.jsx"></script><script type="text/babel" src="QuoteScreen.jsx"></script>
<script type="text/babel">
function App(){const [s,setS]=React.useState(localStorage.getItem('orbit-screen')||'track');const go=k=>{setS(k);localStorage.setItem('orbit-screen',k);window.scrollTo(0,0)};
return <div style={{minHeight:'100vh'}}><PortalHeader screen={s} go={go}/>{s==='track'&&<TrackScreen go={go}/>}{s==='shipments'&&<ShipmentsScreen go={go}/>}{s==='quote'&&<QuoteScreen go={go}/>}</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
