<style>body{background:var(--gray-200);margin:0}</style></head><body><div id="root"></div>
<script type="text/babel">
function Label({ icon, children }) { return <div style={{ display: 'flex', alignItems: 'center', gap: 8, font: '700 13px var(--font-body)', letterSpacing: '.08em', textTransform: 'uppercase', color: 'var(--navy-700)' }}><Icon name={icon} size={16} />{children}</div>; }
var { Icon } = window.OrbitDesignSystem_da09b0;
function Fit({ w, h, children }) {
  const ref = React.useRef(); const [k, setK] = React.useState(1);
  React.useEffect(() => { const f = () => { const el = ref.current; if (!el) return; setK(Math.min(1, el.clientWidth / w, (window.innerHeight - 150) / h)); }; f(); window.addEventListener('resize', f); return () => window.removeEventListener('resize', f); }, [w, h]);
  return <div ref={ref} style={{ width: '100%', display: 'flex', justifyContent: 'center' }}><div style={{ width: w * k, height: h * k }}><div style={{ width: w, height: h, transform: 'scale(' + k + ')', transformOrigin: '0 0', display: 'flex', gap: 48, justifyContent: 'center' }}>{children}</div></div></div>;
}
function Stage() {
  const t = useT(); const [dev, setDev] = React.useState(localStorage.getItem('orbit-dev') || 'iphone');
  const pick = d => { setDev(d); localStorage.setItem('orbit-dev', d); };
  const opts = [['iphone', 'iPhone', 'smartphone'], ['samsung', 'Samsung', 'smartphone'], ['desktop', 'Computer', 'monitor'], ['all', 'All', 'layout-grid']];
  const size = { iphone: [390, 844], samsung: [384, 832], desktop: [1180, 760], all: [390 + 384 + 1180 + 96, 844] }[dev];
  return <div style={{ padding: '16px 20px 32px', display: 'flex', flexDirection: 'column', gap: 18, alignItems: 'center' }}>
    <div style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 12, flexWrap: 'wrap' }}><img src="../../assets/orbit-logo.png" style={{ height: 36 }} /><div style={{ flex: 1 }} /><a href="../admin/index.html" style={{ display: 'inline-flex', alignItems: 'center', gap: 6, height: 36, padding: '0 14px', borderRadius: 'var(--radius-s)', background: 'var(--navy-700)', color: '#fff', font: '700 13px var(--font-body)', textDecoration: 'none' }}><Icon name="layout-dashboard" size={15} />{t('Admin Panel')}</a><LangToggle /></div>
    <Seg options={opts} value={dev} onChange={pick} />
    <Fit w={size[0]} h={size[1]}>
      {(dev === 'iphone' || dev === 'all') && <MobileCustomerApp device="iphone" />}
      {(dev === 'samsung' || dev === 'all') && <MobileCustomerApp device="samsung" start={{ authed: true, tab: 'home', stack: [] }} />}
      {(dev === 'desktop' || dev === 'all') && <DesktopCustomerApp start={{ authed: true, tab: 'home', stack: [] }} />}
    </Fit></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<LangProvider><Stage /></LangProvider>);
</script></body></html>
