<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-m)}.n{font:600 12px var(--font-body);color:var(--text-strong)}.v{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--navy-900);"></div><div class="n">Navy 900</div><div class="v">--navy-900</div></div><div class="sw"><div class="chip" style="background:var(--navy-700);"></div><div class="n">Navy 700 · Primary</div><div class="v">--navy-700</div></div><div class="sw"><div class="chip" style="background:var(--navy-500);"></div><div class="n">Navy 500</div><div class="v">--navy-500</div></div><div class="sw"><div class="chip" style="background:var(--orange-500);"></div><div class="n">Orange 500 · Accent</div><div class="v">--orange-500</div></div><div class="sw"><div class="chip" style="background:var(--orange-600);"></div><div class="n">Orange 600</div><div class="v">--orange-600</div></div><div class="sw"><div class="chip" style="background:var(--orange-50);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="n">Orange 50</div><div class="v">--orange-50</div></div></div></body></html>
