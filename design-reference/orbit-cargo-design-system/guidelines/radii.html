<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-m)}.n{font:600 12px var(--font-body);color:var(--text-strong)}.v{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--navy-50);border:2px solid var(--navy-700);border-radius:var(--radius-xs)"></div><div class="v">--radius-xs</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--navy-50);border:2px solid var(--navy-700);border-radius:var(--radius-s)"></div><div class="v">--radius-s</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--navy-50);border:2px solid var(--navy-700);border-radius:var(--radius-m)"></div><div class="v">--radius-m</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--navy-50);border:2px solid var(--navy-700);border-radius:var(--radius-l)"></div><div class="v">--radius-l</div></div><div class="sw" style="align-items:center"><div style="width:72px;height:56px;background:var(--navy-50);border:2px solid var(--navy-700);border-radius:var(--radius-pill)"></div><div class="v">--radius-pill</div></div></div></body></html>
