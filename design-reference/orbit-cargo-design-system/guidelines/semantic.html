<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Shipment status colors" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-m)}.n{font:600 12px var(--font-body);color:var(--text-strong)}.v{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--status-success-bg);display:flex;align-items:center;justify-content:center;font:700 13px var(--font-body);color:var(--status-success)">Delivered</div><div class="v">--status-success</div></div><div class="sw"><div class="chip" style="background:var(--status-warning-bg);display:flex;align-items:center;justify-content:center;font:700 13px var(--font-body);color:var(--status-warning)">Delayed</div><div class="v">--status-warning</div></div><div class="sw"><div class="chip" style="background:var(--status-danger-bg);display:flex;align-items:center;justify-content:center;font:700 13px var(--font-body);color:var(--status-danger)">Exception</div><div class="v">--status-danger</div></div><div class="sw"><div class="chip" style="background:var(--status-info-bg);display:flex;align-items:center;justify-content:center;font:700 13px var(--font-body);color:var(--status-info)">In transit</div><div class="v">--status-info</div></div></div></body></html>
