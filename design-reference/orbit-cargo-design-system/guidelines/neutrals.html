<!-- @dsCard group="Colors" viewport="700x130" name="Neutrals" subtitle="Cool, navy-tinted grays" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-m)}.n{font:600 12px var(--font-body);color:var(--text-strong)}.v{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--gray-900);"></div><div class="n">900</div><div class="v">--gray-900</div></div><div class="sw"><div class="chip" style="background:var(--gray-800);"></div><div class="n">800</div><div class="v">--gray-800</div></div><div class="sw"><div class="chip" style="background:var(--gray-700);"></div><div class="n">700</div><div class="v">--gray-700</div></div><div class="sw"><div class="chip" style="background:var(--gray-600);"></div><div class="n">600</div><div class="v">--gray-600</div></div><div class="sw"><div class="chip" style="background:var(--gray-500);"></div><div class="n">500</div><div class="v">--gray-500</div></div><div class="sw"><div class="chip" style="background:var(--gray-400);"></div><div class="n">400</div><div class="v">--gray-400</div></div><div class="sw"><div class="chip" style="background:var(--gray-300);"></div><div class="n">300</div><div class="v">--gray-300</div></div><div class="sw"><div class="chip" style="background:var(--gray-200);"></div><div class="n">200</div><div class="v">--gray-200</div></div><div class="sw"><div class="chip" style="background:var(--gray-100);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="n">100</div><div class="v">--gray-100</div></div><div class="sw"><div class="chip" style="background:var(--gray-50);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="n">50</div><div class="v">--gray-50</div></div></div></body></html>
