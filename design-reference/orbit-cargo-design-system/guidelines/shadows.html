<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-m)}.n{font:600 12px var(--font-body);color:var(--text-strong)}.v{font:400 11px var(--font-mono);color:var(--text-muted)}body{background:var(--surface-page)}</style></head><body><div class="row" style="gap:24px;padding:8px"><div class="sw" style="align-items:center"><div style="width:100%;height:72px;background:#fff;border-radius:var(--radius-l);box-shadow:var(--shadow-1)"></div><div class="v">--shadow-1</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:72px;background:#fff;border-radius:var(--radius-l);box-shadow:var(--shadow-2)"></div><div class="v">--shadow-2</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:72px;background:#fff;border-radius:var(--radius-l);box-shadow:var(--shadow-3)"></div><div class="v">--shadow-3</div></div><div class="sw" style="align-items:center"><div style="width:100%;height:72px;background:#fff;border-radius:var(--radius-l);border:1px solid var(--border-strong);box-shadow:var(--focus-ring)"></div><div class="v">--focus-ring</div></div></div></body></html>
