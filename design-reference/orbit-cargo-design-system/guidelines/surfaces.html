<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Page, card, sunken, inverse" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{background:#fff;padding:20px;box-sizing:border-box}*{box-sizing:border-box}.row{display:flex;gap:10px}.sw{flex:1;display:flex;flex-direction:column;gap:6px}.chip{height:64px;border-radius:var(--radius-m)}.n{font:600 12px var(--font-body);color:var(--text-strong)}.v{font:400 11px var(--font-mono);color:var(--text-muted)}</style></head><body><div class="row"><div class="sw"><div class="chip" style="background:var(--surface-page);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="n">Page</div><div class="v">--surface-page</div></div><div class="sw"><div class="chip" style="background:var(--surface-card);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="n">Card</div><div class="v">--surface-card</div></div><div class="sw"><div class="chip" style="background:var(--surface-sunken);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="n">Sunken</div><div class="v">--surface-sunken</div></div><div class="sw"><div class="chip" style="background:var(--surface-brand-tint);box-shadow:inset 0 0 0 1px var(--border-default)"></div><div class="n">Brand tint</div><div class="v">--surface-brand-tint</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse);"></div><div class="n">Inverse</div><div class="v">--surface-inverse</div></div><div class="sw"><div class="chip" style="background:var(--surface-inverse-deep);"></div><div class="n">Inverse deep</div><div class="v">--surface-inverse-deep</div></div></div></body></html>
