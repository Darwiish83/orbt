name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit_app
          POSTGRES_PASSWORD: orbit_ci_pw
          POSTGRES_DB: orbitcargo_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit_app -d orbitcargo_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Server admin, used only to create the least-privilege roles (ADR-029).
      # Migrations then run as orbit_owner and the tests as orbit_runtime /
      # orbit_portal, with random per-run passwords written to .env and .env.test.
      ADMIN_DATABASE_URL: postgresql://orbit_app:orbit_ci_pw@localhost:5433/orbitcargo_test?schema=public
      AUTH_SECRET: ci-only-secret-value-change-me-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Database roles (owner / runtime / portal)
        run: |
          printf 'DATABASE_URL="%s"\n' "$ADMIN_DATABASE_URL" > .env
          printf 'DATABASE_URL="%s"\nNODE_ENV="test"\nAUTH_SECRET="%s"\n' "$ADMIN_DATABASE_URL" "$AUTH_SECRET" > .env.test
          npx tsx scripts/db-setup-roles.ts
      - name: Apply migrations (test DB, as orbit_owner)
        run: npx prisma migrate deploy
      - name: Integration tests (as orbit_runtime / orbit_portal)
        run: npm run test:integration
      - run: npm run build
      - name: Dependency audit (high severity)
        run: npm audit --audit-level=high
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: orbit_app
          POSTGRES_PASSWORD: orbit_ci_pw
          POSTGRES_DB: orbitcargo
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U orbit_app -d orbitcargo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgresql://orbit_app:orbit_ci_pw@localhost:5433/orbitcargo?schema=public
      AUTH_SECRET: ci-only-secret-value-change-me-32chars
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # E2E secrets are random for every run and never stored: the CI database
      # is thrown away afterwards, so nothing needs to live in GitHub Secrets.
      # The database roles get random passwords too (scripts/db-setup-roles.ts);
      # global-setup migrates as orbit_owner and the app runs as orbit_runtime.
      - name: Per-run random secrets and database roles
        run: |
          P1=$(openssl rand -base64 24); P2=$(openssl rand -base64 24)
          echo "::add-mask::$P1"; echo "::add-mask::$P2"
          printf 'DATABASE_URL="%s"\nAUTH_SECRET="%s"\n' "$ADMIN_DATABASE_URL" "$AUTH_SECRET" > .env
          printf 'E2E_DATABASE_URL="%s"\nE2E_PASSWORD="%s"\nE2E_CUSTOMER_PASSWORD="%s"\n' "$ADMIN_DATABASE_URL" "$P1" "$P2" > .env.test
          npx tsx scripts/db-setup-roles.ts
      - run: npx playwright install --with-deps chromium
      # Smoke suite only; visual-regression baselines are platform-specific and
      # are run locally (see tests/e2e/visual.spec.ts).
      - run: npm run test:e2e -- smoke.spec.ts
